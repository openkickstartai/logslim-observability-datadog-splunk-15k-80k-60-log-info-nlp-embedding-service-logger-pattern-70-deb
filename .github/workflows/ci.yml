name: LogSlim CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest test_logslim.py -v --tb=short

      - name: Smoke test CLI
        run: |
          echo '{"service":"api","level":"DEBUG","message":"test log line 1"}' > /tmp/test.log
          echo '{"service":"api","level":"DEBUG","message":"test log line 2"}' >> /tmp/test.log
          echo '{"service":"web","level":"INFO","message":"Health check OK"}' >> /tmp/test.log
          python cli.py /tmp/test.log
          python cli.py /tmp/test.log --json-out | python -m json.tool
